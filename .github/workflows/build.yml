name: Build Zulu APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract Openclaw source
        run: |
          unzip -q openclaw-android-main.zip -d .
          echo "✓ Openclaw extracted"

      - name: Extract Zulu patch
        run: |
          unzip -q zulu-patch.zip -d .
          echo "✓ Zulu patch extracted"

      - name: Apply Zulu patch
        run: |
          cd openclaw-android-main
          bash ../zulu-android/apply-zulu-patch.sh
          echo "✓ Zulu patch applied"

      - name: Build React/TypeScript UI
        run: |
          cd openclaw-android-main/android/www
          npm install
          npm run build
          echo "✓ UI built"

      - name: Fix Gradle memory
        run: |
          cd openclaw-android-main/android
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties

      - name: Make Gradle executable
        run: chmod +x openclaw-android-main/android/gradlew

      - name: Build Debug APK
        run: |
          cd openclaw-android-main/android
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx2048m"

      - name: Rename APK to zulu.apk
        run: |
          cp openclaw-android-main/android/app/build/outputs/apk/debug/app-debug.apk zulu.apk
          echo "✓ APK ready"

      - name: Upload Zulu APK
        uses: actions/upload-artifact@v4
        with:
          name: zulu-apk
          path: zulu.apk
          retention-days: 30
